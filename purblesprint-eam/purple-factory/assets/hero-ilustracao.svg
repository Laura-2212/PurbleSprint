<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Ilustração da esteira PurpleSprint</title>
  <desc id="desc">Ideias se transformam em software por meio de etapas conectadas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ecff"/>
      <stop offset="100%" stop-color="#e8f4fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#903765"/>
      <stop offset="100%" stop-color="#18506A"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="28" fill="url(#bg)"/>
  <rect x="36" y="36" width="648" height="348" rx="22" fill="#fffdf8" stroke="#e7d9ea" stroke-width="2"/>
  <text x="70" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#462648">Da ideia ao software pronto</text>
  <text x="70" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b5e68">Uma esteira clara, humana e acompanhada em cada etapa</text>

  <line x1="95" y1="250" x2="625" y2="250" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <circle cx="120" cy="250" r="34" fill="#903765"/>
    <text x="120" y="258" font-size="22" font-weight="700" fill="#fff">1</text>
    <text x="120" y="305" font-size="14" font-weight="700" fill="#462648">Ideia</text>
    <text x="120" y="325" font-size="12" fill="#6b5e68">Briefing e envio</text>

    <circle cx="246" cy="250" r="34" fill="#7a3d69"/>
    <text x="246" y="258" font-size="22" font-weight="700" fill="#fff">2</text>
    <text x="246" y="305" font-size="14" font-weight="700" fill="#462648">Protótipo</text>
    <text x="246" y="325" font-size="12" fill="#6b5e68">Revisão visual</text>

    <circle cx="372" cy="250" r="34" fill="#5f4a6e"/>
    <text x="372" y="258" font-size="22" font-weight="700" fill="#fff">3</text>
    <text x="372" y="305" font-size="14" font-weight="700" fill="#462648">Software</text>
    <text x="372" y="325" font-size="12" fill="#6b5e68">Construção</text>

    <circle cx="498" cy="250" r="34" fill="#3a4f6d"/>
    <text x="498" y="258" font-size="22" font-weight="700" fill="#fff">4</text>
    <text x="498" y="305" font-size="14" font-weight="700" fill="#462648">Validação</text>
    <text x="498" y="325" font-size="12" fill="#6b5e68">Conferência</text>

    <circle cx="624" cy="250" r="34" fill="#18506A"/>
    <text x="624" y="258" font-size="22" font-weight="700" fill="#fff">5</text>
    <text x="624" y="305" font-size="14" font-weight="700" fill="#462648">Entrega</text>
    <text x="624" y="325" font-size="12" fill="#6b5e68">Aprovação final</text>
  </g>

  <g>
    <rect x="70" y="150" width="180" height="54" rx="12" fill="#f4e7ed"/>
    <text x="92" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#903765">Inscreva-se e participe</text>
    <rect x="270" y="150" width="190" height="54" rx="12" fill="#e7f1f6"/>
    <text x="292" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#18506A">Acompanhe cada etapa</text>
    <rect x="480" y="150" width="170" height="54" rx="12" fill="#f1ebdf"/>
    <text x="502" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#462648">Valide com segurança</text>
  </g>
</svg>